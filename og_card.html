<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;800&family=IBM+Plex+Sans+Thai:wght@500;600&display=swap">
<style>
  /* 1200x630 sharing card, screenshotted once into dist/og.png */
  html, body { margin: 0; width: 1200px; height: 630px; background: #fbfcfd; }
  body { font-family: "Schibsted Grotesk", "IBM Plex Sans Thai", sans-serif; color: #161a22; padding: 64px 72px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .k { font-size: 20px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #7b8491; }
  h1 { font-size: 86px; line-height: .98; font-weight: 800; letter-spacing: -0.02em; margin: 18px 0 0; max-width: 11ch; }
  h1 span { color: #7b8491; font-weight: 600; }
  .th { font-family: "IBM Plex Sans Thai", sans-serif; font-size: 30px; font-weight: 600; color: #4f5866; margin-top: 14px; }
  .row { display: flex; gap: 56px; align-items: flex-end; }
  .n { font-size: 64px; font-weight: 800; line-height: 1; }
  .n.o { color: #e0572a; }
  .l { font-size: 20px; color: #4f5866; margin-top: 6px; max-width: 16ch; }
  .bars { display: flex; gap: 5px; align-items: flex-end; margin-left: auto; height: 120px; }
  .bars i { display: block; width: 34px; border-radius: 4px 4px 0 0; background: #104281; }
</style></head>
<body>
  <div>
    <div class="k">Thailand · 2014–2026 · Data story</div>
    <h1>The Fall of Thai Governments</h1>
    <div class="th">รัฐบาลที่ล้มแล้วล้มอีก</div>
  </div>
  <div class="row">
    <div><div class="n">5</div><div class="l">cabinets in seven years</div></div>
    <div><div class="n o">1.2%</div><div class="l">of MPs' bills became law</div></div>
    <div><div class="n o">84</div><div class="l">days, the shortest cabinet</div></div>
    <div class="bars" aria-hidden="true"><i style="height:120px"></i><i style="height:28px"></i><i style="height:29px"></i><i style="height:7px;background:#e0572a"></i><i style="height:15px;background:#3987e5"></i></div>
  </div>
</body></html>
